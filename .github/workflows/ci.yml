name: CI

# Every push to main: checks, then deploy staging, then production (if the Cloudflare token is set).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build the Worker bundle
        run: npx opennextjs-cloudflare build
        working-directory: apps/web

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN secret is not set, deploy skipped. See docs/CLOUDFLARE.md."
      - uses: actions/checkout@v5
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v5
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.CLOUDFLARE_API_TOKEN != ''
      - name: Deploy staging (migrate database, deploy Worker)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run deploy:staging
      - name: Check staging
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: curl --fail --retry 5 --retry-delay 5 --retry-all-errors https://cs-vv-fantasy-staging.vram-arm.workers.dev/api/health
      - name: Deploy production (migrate database, deploy Worker)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run deploy:production
      - name: Check production
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: curl --fail --retry 5 --retry-delay 5 --retry-all-errors https://cs-vv-fantasy.vram-arm.workers.dev/api/health
